[package]
name = "discordbot-rs"
version = "0.2.0-dev"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
poise = "0.7.0"
serenity = "0.12.5"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
